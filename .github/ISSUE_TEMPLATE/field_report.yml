name: Field report
description: You ran mango on a real ticket. Paste the aggregate row ticket_stats.py prints, so it can be added to docs/COST.md.
labels: [field-report]
body:
  - type: markdown
    attributes:
      value: |
        Run `python3 <mango>/scripts/ticket_stats.py <workdoc> --row` in your project (see docs/COST.md). The row holds counts, tokens, minutes, a lane, a scope letter, a version and a date only. Read it before you paste it. Do not paste your ticket, its working doc, paths, keys or names.
  - type: input
    id: row
    attributes:
      label: The row ticket_stats.py --row printed
      placeholder: "| full | M/3 | 2 | 62021 | 0 | unknown | 41 | 2 | 1/2 | 1.23.0 | 2026-11-06 |"
    validations:
      required: true
  - type: textarea
    id: friction
    attributes:
      label: What got in the way (optional; no project details)
