name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # Required gate: deterministic, stdlib-only, no network.
      - name: Validate marketplace and plugin manifests
        run: python3 scripts/validate.py

      # Required gate: the harness scripts' own suite (RUN CONTRACT / RECONCILE / BUDGET / CHECK-LINES) (stdlib only, no network, no dispatch).
      # Every git test builds its own throwaway repo under tempfile.
      - name: Harness script suite
        run: python3 tests/envelope/test_envelope.py

      # Best-effort, non-blocking: the Claude Code CLI strict validator.
      - name: Claude Code plugin validate (best-effort)
        continue-on-error: true
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate ./plugins/mango --strict
          claude plugin validate . --strict
